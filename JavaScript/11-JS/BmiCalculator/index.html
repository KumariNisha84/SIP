<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: linear-gradient(135deg, #dbeafe, #f8fafc);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 20px;
}

.box {
    width: 380px;
    background: #fff;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
}

h1 {
    text-align: center;
    color: #1e293b;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 8px;
    font-weight: 600;
    color: #475569;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
    background: #f8fafc;
    transition: all 0.3s ease;
}

/* Hover Effect */
input:hover {
    border-color: #0ea5e9;
    background: #ffffff;
}

/* Focus Effect */
input:focus {
    border-color: #0ea5e9;
    box-shadow: 0 0 8px rgba(14, 165, 233, 0.25);
    background: #fff;
}

.btn {
    width: 100%;
    margin-top: 25px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #0f766e;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
}

/* Button Hover */
.btn:hover {
    background: #115e59;
}

/* Button Click */
.btn:active {
    transform: scale(0.98);
}

#result {
    margin-top: 22px;
    padding: 15px;
    background: #ecfeff;
    border-left: 5px solid #14b8a6;
    border-radius: 8px;
    text-align: center;
    color: #164e63;
}

#result h3 {
    margin-bottom: 6px;
    color: #1e293b;
}

#result p {
    font-weight: 600;
    color: #0f766e;
}

@media (max-width: 450px) {
    .box {
        width: 100%;
        padding: 25px;
    }
}
    </style>
</head>

<body>

    <div class="container">

        <div class="box">
            <h1>BMI Calculator</h1>

            <label>Height (cm)</label>
            <input type="number" id="height" placeholder="Enter height">

            <label>Weight (kg)</label>
            <input type="number" id="weight" placeholder="Enter weight">

            <button class="btn" onclick="calculateBMI()">
                Calculate
            </button>
            <div id="result"></div>
        </div>
    </div>

    <script>

        function calculateBMI() {

            let height = document.getElementById("height").value;
            let weight = document.getElementById("weight").value;
            let result = document.getElementById("result");

            if (height == "" || weight == "") {
                result.innerHTML = "Please enter height and weight";
                return;
            }

            let bmi = weight / ((height / 100) * (height / 100));
            let message = "";

            if (bmi < 18.5) {
                message = "Underweight";
            }
            else if (bmi < 25) {
                message = "Normal Weight";
            }
            else if (bmi < 30) {
                message = "Overweight";
            }
            else {
                message = "Obese";
            }

            result.innerHTML = `
        <h3>Your BMI: ${bmi.toFixed(2)}</h3>
        <p>${message}</p>
    `;
        }

    </script>

</body>

</html>

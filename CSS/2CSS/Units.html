<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* Unordered List Styling */
        #a{
            list-style-type: square;
            font-size: 20px;
        }
        #b{
            list-style-type:circle;
            font-size:1cm;
        }
        #c{
            list-style-type:disc;
            font-size: 8mm;
        }
        #d{
            list-style-type:armenian;
            font-size: 0.3in;
        }

/* Ordered List Styling */
        #e{
            list-style-type: upper-roman;
            font-size: 60%;
          
        }
        #f{
            list-style-type:lower-alpha;
            font-size: 2em;
            
        }
        #g{
            list-style-type:decimal;
            font-size: 2rem;
            
           
        }
        #h{
            list-style-type:lower-roman;
            font-size: 2vh;
        
        }
    </style>
</head>
<body>
    <h1>Let's begin todays class..</h1>
    <h2>Unordered List</h2>
    <ul>
        
        <li id="a">HTML</li>
        <li id="b">CSS</li>
        <li id="c">JavaScript</li>
        <li id="d">React</li>
    </ul>

    <!-- ordered list -->
     <h2>Ordered List</h2>
     <ol>
        <li id="e">HTML</li>
        <li id="f">CSS</li>
        <li id="g">JavaScript</li>
        <li id="h">React</li>
     </ol>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        div{
            border: 1px solid black;
            margin: 12px;
            height: 50px;
            width: 100px;
            padding: 10px;
          
        }
        .rel{
            position: relative;
            top: 20px;
            left: 150px;
        }
    </style>
</head>
<body>
    <div>Hello</div>
    <div class="rel">Hi</div>
    <div>Bye!!</div>
</body>
</html>

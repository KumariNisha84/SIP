<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
    <style>
        /* Element Selectors */
        div{
            color: rgb(6, 122, 122);
            font-style: italic;
            
            
        }


        /* class selector */
        .who{
            color: rgb(71, 11, 128);
            font-size: 20px;
        }

        /* id selector */
        #session{
            color: rgba(184, 111, 17, 0.918);
            font-size: 20px;
            font-weight: bold;
        }

        /* universal selector */
        *{
            background-color:rgb(240, 220, 195);
        }

        .img{
           background-image: url(./tulip2_img.webp);
           height: 300px;
           width: 300px;
           background-size: cover;
           border-radius: 50%;
           margin-top: 20px;
           border: 3px solid rgb(248, 95, 95)
        
           
           
           
        }
    </style>
</head>
<body>
    <h3>Nisha 🌼</h3>
    <div>
        Hey! Welcome Back To My Channel.༼ つ ◕_◕ ༽つ
    </div><br>
    <div class="who">
        I hope you all are doing well.😊
    </div> <br>
    <div id="session">
        Let's start our session.👍
    </div>
    <div class="img">
        
    </div>
</body>
</html>

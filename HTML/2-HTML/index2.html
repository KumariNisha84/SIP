<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <div>
   <h1>Student Registration Form 👩‍🏫</h1> 
   <form >
    <label>Name:</label>
    <input type="text" placeholder="Enter your Name"><br><br>
    <label for="">Email:</label>
    <input type="email" placeholder="Enter Email"><br><br>

    <label for="phone-number">Phone:</label>
    <input type="tel" placeholder="Enter Phone Number"><br><br>

    <label for="">Password:</label>
    <input type="password" required placeholder="Enter Password"><br><br>

    <label for="gender">Gender:</label><br>
    <input type="radio" name="gender">Male <br>
    <input type="radio" name="gender">Female <br>
    <input type="radio" name="gender">Other<br><br>

    <label for="">DOB:</label>
    <input type="datetime-local"><br><br>

    <label for="Skills">Skills:</label><br>
    <input type="checkbox">HTML <br>
    <input type="checkbox">CSS <br>
    <input type="checkbox">NodeJS <br>
    <input type="checkbox">React <br>
    <input type="checkbox">Python <br><br>

    <label for="city">City</label>
    <select name="" id="">
        <option value="">Choose City</option>
        <option value="">Indore</option>
        <option value="">Dewas</option>
        <option value="">Ujjain</option>
    </select><br><br>

    <label for="">Comments:</label>
    <textarea name="" id="" ></textarea>

   
</form>
</div>
</body>
</html>
